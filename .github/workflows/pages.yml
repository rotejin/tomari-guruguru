name: Build and Deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Every job starts read-only. Only the deploy job gets the Pages permissions, so
# nothing that runs during npm ci or the build can publish the site.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds, but never a deployment in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # npm ci fails when package-lock.json does not match package.json.
      - name: Install dependencies
        run: npm ci

      - name: Known vulnerabilities in the dependencies
        run: npm audit

      # Starting and stopping the microphone, with a fake getUserMedia and AudioContext.
      - name: Tests
        run: npm test

      # The character sheet tool (tools/slice_character_sheets.py). Standard library
      # only; ffmpeg is not needed because the tests only look at the commands.
      - name: Tests (character sheet tool)
        run: python3 -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Build
        run: npm run build

      - name: Verify Pages artifacts
        run: npm run verify:pages

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
