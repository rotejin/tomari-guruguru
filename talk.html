<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トマリトーク</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  img { -webkit-user-drag: none; }
  /* 下の中央の箱（エラーの文・再生バー・操作バー）。中身の幅まで広がり、画面より広くはならない。
     （left: 50% だけだと、画面の半分の幅までしか広がれず、幅 940px くらいから字が折り返していた） */
  .talk-dock { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 32px); }
  /* 狭い画面では、右下の Tweaks のボタン（高さ 約 32px）にかぶらないよう、その上に出す */
  @media (max-width: 660px) { .talk-dock { bottom: 60px; } }
  @media (prefers-reduced-motion: no-preference) {
    .bob { animation: bob 3.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -1.2vmin; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="src/talk-app.jsx"></script>
</body>
</html>
